<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Scores</title>
<!-- iOS has no Fullscreen API, but "Add to Home Screen" launches without
     browser chrome, which gets you the same result -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scores">
<meta name="theme-color" content="#0a1410">
<style>
  :root{
    --field:#0a1410;
    --field-2:#122019;
    --chalk:#e8eee9;
    --dim:#7d9187;
    --rule:#22362c;
    --live:#ffb020;
    --final:#5f7a6d;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}

  body{
    background:var(--field);
    color:var(--chalk);
    font-family:"Roboto Condensed","Oswald","Arial Narrow",system-ui,sans-serif;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  header{
    display:flex;
    align-items:baseline;
    gap:1.5rem;
    padding:2.2vh 3vw 1.4vh;
    border-bottom:2px solid var(--rule);
    flex:0 0 auto;
  }

  h1{
    font-size:clamp(1.4rem,3.2vh,2.6rem);
    font-weight:700;
    letter-spacing:.06em;
    line-height:1;
  }

  #clock{
    margin-left:auto;
    font-size:clamp(1.4rem,3.2vh,2.6rem);
    font-variant-numeric:tabular-nums;
    font-weight:300;
    color:var(--dim);
  }

  #date{
    font-size:clamp(.8rem,1.8vh,1.2rem);
    color:var(--dim);
    font-weight:300;
  }

  main{
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    justify-content:center;
    overflow:hidden;
  }

  .row{
    display:flex;
    align-items:stretch;
    border-bottom:1px solid var(--rule);
    height:var(--rowh);
    overflow:hidden;
  }
  .row:last-child{border-bottom:none}

  .league{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    padding:0 1.6vw;
    background:var(--field-2);
    font-size:clamp(1rem,2.4vh,1.9rem);
    font-weight:700;
    letter-spacing:.08em;
    border-right:2px solid var(--rule);
    min-width:8.5em;
  }

  .track{
    flex:1 1 auto;
    overflow:hidden;
    position:relative;
    display:flex;
    align-items:center;
  }

  .strip{
    display:flex;
    align-items:center;
    white-space:nowrap;
    will-change:transform;
    animation:slide 76s linear infinite;
  }

  @keyframes slide{
    from{transform:translateX(0)}
    to{transform:translateX(-50%)}
  }

  .row:hover .strip{animation-play-state:paused}
  .row.paused .strip{animation-play-state:paused}

  .game{
    display:flex;
    align-items:center;
    gap:1.1vw;
    padding:0 2.2vw;
    border-right:1px solid var(--rule);
    font-size:clamp(1rem,2.6vh,2rem);
  }

  /* games on a future day sit back a little */
  .game.future{opacity:.72}

  /* a game that just scored — highlighted and pinned to the front */
  .game.scored{
    background:rgba(255,176,32,.13);
    box-shadow:inset 0 0 0 1px rgba(255,176,32,.5);
    animation:flash 1.4s ease-out 3;
  }

  @keyframes flash{
    0%,100%{background:rgba(255,176,32,.13)}
    50%    {background:rgba(255,176,32,.34)}
  }

  .gained{
    font-size:.62em;
    font-weight:700;
    color:var(--field);
    background:var(--live);
    padding:.1em .4em;
    border-radius:2px;
    margin-left:.15em;
  }

  .divider{
    display:flex;
    align-items:center;
    padding:0 1.6vw;
    font-size:.72em;
    font-weight:700;
    letter-spacing:.18em;
    color:var(--dim);
    border-right:1px solid var(--rule);
    align-self:stretch;
  }

  .tierbadge{
    font-size:.55em;
    font-weight:700;
    letter-spacing:.08em;
    color:var(--field);
    background:var(--live);
    padding:.15em .45em;
    border-radius:2px;
    margin-right:.3em;
  }

  .daytag{
    font-size:.6em;
    font-weight:700;
    letter-spacing:.1em;
    color:var(--live);
    padding-right:.3em;
  }

  .side{display:flex;align-items:center;gap:.5em}
  .abbr{font-weight:700}

  .logo{
    height:1.35em;
    width:1.35em;
    object-fit:contain;
    flex:0 0 auto;
  }

  /* dim the losing team's mark along with its text */
  .loser .logo{opacity:.45}

  .rank{
    font-size:.62em;
    color:var(--live);
    font-weight:700;
    vertical-align:super;
  }

  .record{
    font-size:.6em;
    color:var(--dim);
    font-weight:400;
    font-variant-numeric:tabular-nums;
    margin-left:-.15em;
  }

  .score{
    font-variant-numeric:tabular-nums;
    font-weight:300;
    min-width:1.4em;
    text-align:right;
  }

  .winner .abbr,.winner .score{color:#fff}
  .loser .abbr,.loser .score{color:var(--final)}

  .status{
    font-size:.68em;
    color:var(--dim);
    padding-left:.4em;
    letter-spacing:.03em;
  }

  .status.live{color:var(--live);font-weight:700}

  .status.live::before{
    content:"";
    display:inline-block;
    width:.5em;height:.5em;
    border-radius:50%;
    background:var(--live);
    margin-right:.45em;
    animation:pulse 1.6s ease-in-out infinite;
  }

  @keyframes pulse{50%{opacity:.25}}

  .empty{
    padding:0 2.2vw;
    color:var(--dim);
    font-size:clamp(.9rem,2.2vh,1.5rem);
    font-weight:300;
  }

  footer{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:.7rem;
    padding:1.2vh 3vw;
    border-top:2px solid var(--rule);
    font-size:clamp(.75rem,1.7vh,1.1rem);
    color:var(--dim);
    font-weight:300;
  }

  #updated{margin-left:auto;font-variant-numeric:tabular-nums}

  button{
    font:inherit;
    color:var(--chalk);
    background:transparent;
    border:1px solid var(--rule);
    border-radius:2px;
    padding:.35em .9em;
    cursor:pointer;
  }
  button:hover{background:var(--field-2)}
  button:focus-visible{outline:2px solid var(--live);outline-offset:2px}
  button[aria-pressed="true"]{
    background:var(--field-2);
    border-color:var(--live);
    color:var(--live);
  }

  @media (prefers-reduced-motion:reduce){
    .strip{animation:none}
    .status.live::before{animation:none}
  }

  /* ---------- phones ----------
     The TV layout divides the screen height across leagues, which leaves
     each row a few millimetres tall on a phone. Here rows get a fixed
     readable height and the board scrolls vertically instead. */
  @media (max-width:640px){
    header{
      flex-wrap:wrap;
      gap:.4rem .8rem;
      padding:1rem 1rem .7rem;
      padding-top:max(1rem, env(safe-area-inset-top));
    }
    h1{font-size:1.25rem;width:100%}
    #date{font-size:.85rem}
    #clock{font-size:1.1rem}

    main{
      display:block;
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
    }

    /* override the JS-set --rowh so rows don't shrink to fit */
    .row{height:auto;min-height:3.4rem}

    .league{
      min-width:4.6em;
      padding:0 .7rem;
      font-size:.9rem;
      letter-spacing:.05em;
    }

    .game{
      font-size:1.05rem;
      gap:.45rem;
      padding:0 1rem;
    }

    .logo{height:1.2em;width:1.2em}

    footer{
      flex-wrap:wrap;
      gap:.5rem;
      padding:.8rem 1rem;
      padding-bottom:max(.8rem, env(safe-area-inset-bottom));
      font-size:.8rem;
    }
    #updated{width:100%;margin-left:0;text-align:right}
    button{padding:.5em 1em}   /* larger tap targets */
  }
</style>
</head>
<body>

<header>
  <h1>Live Scores</h1>
  <span id="date"></span>
  <span id="clock"></span>
</header>

<main id="board"></main>

<footer>
  <button id="mode" aria-pressed="false">Show next 7 days</button>
  <button id="rosters">Check rosters</button>
  <button id="tiers" aria-pressed="false">Show tiers</button>
  <button id="fs">Go fullscreen</button>
  <button id="refresh">Refresh now</button>
  <span id="updated">Loading…</span>
</footer>

<script>
/* ------------------------------------------------------------------
   Leagues to show. Comment out any you don't want, or add more using
   ESPN's sport/league path format.
   ------------------------------------------------------------------ */
const LEAGUES = [
  { label:"CFB",   path:"football/college-football" },
  { label:"NFL",   path:"football/nfl" },
  { label:"MLB",   path:"baseball/mlb" },
  // hidden for now — uncomment to bring back
  // { label:"NCAAH", path:"hockey/mens-college-hockey" },
  // { label:"NHL",   path:"hockey/nhl" },
  // { label:"NBA",   path:"basketball/nba" },
];

const REFRESH_MS = 60_000;      // idle polling
const LIVE_REFRESH_MS = 20_000; // polling while a game is in progress
let nextPoll = null;
const DAYS_AHEAD = 7;
const SHOW_LOGOS = true;   // set false for a text-only ticker
const SHOW_RECORDS = true; // show each team's W-L next to its abbreviation
const MAX_RESULT_AGE_DAYS = 3;  // hide finished games older than this
const MAX_FUTURE_GAMES = 20;    // how many upcoming games ride along each loop
const SCORE_FLASH_MS = 90_000;  // how long a scoring game stays pinned to the front
const FLASH_SHOWCASE_MS = 12_000; // how long the row holds at the front before resuming
const START_HOLD_MS = 1_000;      // pause on the first game before scrolling starts

/* remembers each game's last seen score so we can spot changes between
   refreshes; a game only flashes on a change, never on first sight */
const scoreMemory = new Map();   // game id -> "21-14"
const scoreFlash  = new Map();   // game id -> {at, deltas:[n,n]}

function trackScores(games){
  let fresh = false;
  games.forEach(g => {
    const now = g.teams.map(t => Number(t.score) || 0);
    const prev = scoreMemory.get(g.id);

    if(prev && g.state === "in" && now.some((n, i) => n !== prev[i])){
      scoreFlash.set(g.id, { at: Date.now(), deltas: now.map((n, i) => n - prev[i]) });
      fresh = true;
    }
    scoreMemory.set(g.id, now);
  });
  return fresh;   // true if anything scored on this pass
}

function flashing(g){
  const f = scoreFlash.get(g.id);
  return !!f && (Date.now() - f.at) < SCORE_FLASH_MS;
}

/* ------------------------------------------------------------------
   College football sort order: Pac-12, Mountain West, Big 12, Big Ten,
   then any remaining game with a top-25 team, then the rest of FBS.

   Membership is pulled live from ESPN by conference group ID, so
   realignment updates itself. The lists below are only a fallback for
   when that lookup fails — current as of the 2026 season.
   ------------------------------------------------------------------ */
const CONFERENCES = [
  { name:"Pac-12",       group:9,  fallback:
    ["ORST","WSU","BSU","FRES","SDSU","CSU","USU","TXST"] },

  { name:"Mountain West", group:17, fallback:
    ["AFA","WYO","UNLV","NEV","UNM","SJSU","HAW","UTEP","NIU","NDSU"] },

  { name:"Big 12",       group:4,  fallback:
    ["ARIZ","ASU","BAY","BYU","CIN","COLO","HOU","ISU","KU","KSU",
     "OKST","TCU","TTU","UCF","UTAH","WVU"] },

  { name:"Big Ten",      group:5,  fallback:
    ["ILL","IND","IOWA","MD","MICH","MSU","MINN","NEB","NW","OSU",
     "PSU","PUR","RUTG","WIS","ORE","WASH","UCLA","USC"] },
];

/* filled in by loadConferences(); index matches CONFERENCES order */
let confSets = CONFERENCES.map(c => new Set(c.fallback));
let confLive = CONFERENCES.map(() => false);
let confReport = "";

async function loadConferences(){
  await Promise.all(CONFERENCES.map(async (conf, i) => {
    try{
      // NOTE: site.api.espn.com ignores the groups parameter and returns all
      // of FBS. The site.web.api host honors it, but only with groupType and
      // enable set — this is the request ESPN's own conference dropdown makes.
      const res = await fetch(
        "https://site.web.api.espn.com/apis/site/v2/sports/football/" +
        "college-football/teams?groups=" + conf.group +
        "&groupType=conference&enable=groups&limit=100");
      if(!res.ok) throw new Error(res.status);
      const data = await res.json();
      const teams = data.sports[0].leagues[0].teams || [];
      const abbrs = teams.map(t => t.team && t.team.abbreviation).filter(Boolean);

      // ESPN sometimes ignores the groups filter and hands back all of FBS.
      // A real conference is 8-20 teams, so anything outside that means the
      // filter didn't apply and the list is useless for tiering.
      if(abbrs.length < 6 || abbrs.length > 24){
        throw new Error("group filter returned " + abbrs.length + " teams");
      }
      confSets[i] = new Set(abbrs);
      confLive[i] = true;
    }catch(err){
      console.warn("Using built-in roster for " + conf.name + ":", err.message);
    }
  }));
}
const API = "https://site.api.espn.com/apis/site/v2/sports/";

let weekMode = false;   // false = today only, true = next 7 days
const board = document.getElementById("board");

/* ---------- clock ---------- */
function tick(){
  const now = new Date();
  document.getElementById("clock").textContent =
    now.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
  document.getElementById("date").textContent =
    now.toLocaleDateString([], {weekday:"long", month:"long", day:"numeric"});
}
tick();
setInterval(tick, 10_000);

/* ---------- date helpers ---------- */
const pad = n => String(n).padStart(2,"0");
const stamp = d => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;

function dateRange(){
  const start = new Date();
  const end = new Date();
  end.setDate(end.getDate() + DAYS_AHEAD);
  return stamp(start) + "-" + stamp(end);
}

function isToday(d){
  const n = new Date();
  return d.getFullYear()===n.getFullYear() &&
         d.getMonth()===n.getMonth() &&
         d.getDate()===n.getDate();
}

/* ---------- fetch ---------- */
async function getLeague(league){
  const params = [];
  if(weekMode) params.push("dates=" + dateRange());
  // ESPN's college football scoreboard returns only a featured handful by
  // default; group 80 is all of FBS
  if(league.path === "football/college-football") params.push("groups=80");
  params.push("limit=300");

  const url = API + league.path + "/scoreboard?" + params.join("&");
  try{
    const res = await fetch(url);
    if(!res.ok) throw new Error(res.status);
    const data = await res.json();
    const games = (data.events || []).map(parseEvent).filter(Boolean).filter(freshEnough);

    trackScores(games);

    // a game that just scored jumps to the front of its row, ahead of
    // everything else, until the flash expires
    const flashRank = g => flashing(g) ? 0 : 1;

    if(league.path === "football/college-football"){
      games.sort((a,b) =>
        flashRank(a)  - flashRank(b)  ||
        stateRank(a)  - stateRank(b)  ||
        cfbTier(a)    - cfbTier(b)    ||
        a.date - b.date);
    }else{
      games.sort((a,b) =>
        flashRank(a) - flashRank(b) ||
        stateRank(a) - stateRank(b) ||
        a.date - b.date);
    }

    // return everything; paging through the schedule happens at render time
    const current  = games.filter(g => !g.future);
    const upcoming = games.filter(g =>  g.future);
    return current.concat(upcoming);
  }catch(err){
    console.warn("Couldn't load " + league.label, err);
    return null;
  }
}

/* keep live and upcoming games always; drop finals once they age out */
function freshEnough(g){
  if(g.state !== "post") return true;
  const ageDays = (Date.now() - g.date) / 86_400_000;
  return ageDays <= MAX_RESULT_AGE_DAYS;
}

function cfbTier(g){
  const abbrs = g.teams.map(t => t.abbr);
  for(let i = 0; i < confSets.length; i++){
    if(abbrs.some(a => confSets[i].has(a))) return i;   // 0..3
  }
  if(g.teams.some(t => t.rank)) return confSets.length;      // remaining top 25
  return confSets.length + 1;                                // rest of FBS
}

/* live games lead, then anything already played or starting today,
   then future dates — conference order repeats within each block */
function stateRank(g){
  if(g.state === "in") return 0;
  return g.future ? 2 : 1;
}

function parseEvent(ev){
  const comp = ev.competitions && ev.competitions[0];
  if(!comp) return null;
  const type = (comp.status && comp.status.type) || {};
  const when = new Date(ev.date);

  const teams = (comp.competitors || []).map(c => ({
    abbr: (c.team && (c.team.abbreviation || c.team.shortDisplayName)) || "—",
    logo: (c.team && (c.team.logo || (c.team.logos && c.team.logos[0] && c.team.logos[0].href))) || "",
    record: (() => {
      const recs = c.records || [];
      // "total" is the overall W-L; fall back to the first record listed
      const overall = recs.find(r => r.type === "total" || r.name === "overall") || recs[0];
      return (overall && overall.summary) || "";
    })(),
    score: c.score ?? "",
    rank: c.curatedRank && c.curatedRank.current <= 25 ? c.curatedRank.current : null,
    winner: !!c.winner,
    home: c.homeAway === "home",
  }));

  teams.sort((a,b) => (a.home === b.home) ? 0 : (a.home ? 1 : -1));

  return {
    id: ev.id,
    teams,
    date: when,
    state: type.state,                  // pre | in | post
    detail: type.shortDetail || "",
    scheduled: type.state === "pre",
    future: !isToday(when) && when > new Date(),
  };
}

/* ---------- render ---------- */
const TIER_NAMES = ["PAC12","MWC","B12","B1G","T25","FBS"];
let showTiers = false;

function gameHTML(g){
  const flash = flashing(g) ? scoreFlash.get(g.id) : null;

  const sides = g.teams.map((t, idx) => {
    const cls = g.state === "post" ? (t.winner ? "winner" : "loser") : "";
    const rank = t.rank ? `<span class="rank">${t.rank}</span>` : "";
    const score = g.scheduled ? "" : `<span class="score">${t.score}</span>`;
    const logo = (SHOW_LOGOS && t.logo)
      ? `<img class="logo" src="${t.logo}" alt="" loading="lazy" onerror="this.remove()">`
      : "";
    const rec = (SHOW_RECORDS && t.record)
      ? `<span class="record">${t.record}</span>` : "";
    const gained = (flash && flash.deltas[idx] > 0)
      ? `<span class="gained">+${flash.deltas[idx]}</span>` : "";
    return `<span class="side ${cls}">${logo}${rank}<span class="abbr">${t.abbr}</span>${rec}${score}${gained}</span>`;
  }).join("");

  // future games get a day tag and a local start time instead of ESPN's detail
  let tag = "", detail = g.detail;
  if(g.future){
    const days = (g.date - new Date()) / 86_400_000;
    // inside a week a weekday reads faster; past that it's ambiguous,
    // so switch to an actual date
    tag = days < 6
      ? g.date.toLocaleDateString([], {weekday:"short"})
      : g.date.toLocaleDateString([], {month:"short", day:"numeric"});
    tag = `<span class="daytag">${tag}</span>`;
    detail = g.date.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
  }

  const statusCls = g.state === "in" ? "status live" : "status";
  const tier = showTiers
    ? `<span class="tierbadge">${TIER_NAMES[cfbTier(g)] || "?"}</span>`
    : "";
  return `<span class="game${g.future ? " future" : ""}${flash ? " scored" : ""}">` +
         `${tier}${tag}${sides}` +
         `<span class="${statusCls}">${detail}</span></span>`;
}

function trackHTML(games, label){
  if(games === null){
    return `<span class="empty">Scores unavailable</span>`;
  }
  if(games.length === 0){
    return `<span class="empty">${weekMode ? "Nothing scheduled" : "No games today"}</span>`;
  }
  // when the schedule spans several pages, say which one is showing
  const pages = label ? pageCount(label) : 1;
  const page  = label ? ((futurePage.get(label) || 0) % pages) + 1 : 1;
  const label_ = pages > 1 ? `UPCOMING ${page}/${pages}` : "UPCOMING";
  // a marker where results end and the schedule begins, so the loop reads as
  // two distinct segments rather than one undifferentiated run
  const firstFuture = games.findIndex(g => g.future);
  const cells = games.map((g, i) =>
    (i === firstFuture && i > 0 ? `<span class="divider">${label_}</span>` : "") + gameHTML(g)
  ).join("");
  // duplicate the strip so the -50% scroll loops seamlessly
  return `<div class="strip">${cells}${cells}</div>`;
}

function rowHTML(league, games){
  return `
    <section class="row">
      <div class="league">${league.label}</div>
      <div class="track">${trackHTML(games, league.label)}</div>
    </section>`;
}

/* Track what each row currently shows so a refresh that changes
   nothing leaves the DOM — and the running animation — untouched. */
const rendered = new Map();   // league label -> inner HTML
let renderedLabels = "";
const shownFlashes = new Set();   // flashes already put on screen
const resumeTimers = new Map();   // league label -> pending resume timeout

/* Each row shows all live/finished games plus one page of the schedule.
   When the strip finishes a lap the row advances to the next page, so a
   long slate is worked through 20 at a time instead of repeating. */
const leagueGames = new Map();   // label -> full sorted game list
const futurePage  = new Map();   // label -> which page of upcoming games

function visibleGames(label){
  const games = leagueGames.get(label);
  if(!games || games === null) return games;

  const current  = games.filter(g => !g.future);
  const upcoming = games.filter(g =>  g.future);
  if(upcoming.length <= MAX_FUTURE_GAMES) return current.concat(upcoming);

  const pages = Math.ceil(upcoming.length / MAX_FUTURE_GAMES);
  const page  = (futurePage.get(label) || 0) % pages;
  const start = page * MAX_FUTURE_GAMES;
  return current.concat(upcoming.slice(start, start + MAX_FUTURE_GAMES));
}

function pageCount(label){
  const games = leagueGames.get(label);
  if(!games) return 1;
  const upcoming = games.filter(g => g.future).length;
  return Math.max(1, Math.ceil(upcoming / MAX_FUTURE_GAMES));
}

/* Watches for the strip completing a full lap and swaps in the next page of
   upcoming games when it does. Re-armed after every render, since rebuilding
   the strip discards the old listener along with the element. */
function armPaging(label, track){
  const strip = track.querySelector(".strip");
  if(!strip || pageCount(label) < 2) return;

  strip.addEventListener("animationiteration", () => {
    futurePage.set(label, (futurePage.get(label) || 0) + 1);
    const html = trackHTML(visibleGames(label), label);
    if(rendered.get(label) === html) return;

    track.innerHTML = html;
    rendered.set(label, html);
    const next = track.querySelector(".strip");
    if(next){
      setStripSpeed(next, 0);   // each new page starts from the front
      armPaging(label, track);
    }
  }, { once: true });
}

function setStripSpeed(strip, carryFraction){
  const secs = Math.max(25, Math.round(strip.scrollWidth / 88));
  strip.style.animationDuration = secs + "s";
  // a negative delay starts the animation mid-cycle, so a rebuilt strip
  // picks up where the old one left off instead of snapping to the start.
  // when starting from the front, a positive delay instead holds the first
  // game still for a beat so it's readable before the scroll begins.
  const delay = carryFraction > 0
    ? -carryFraction * secs
    : START_HOLD_MS / 1000;
  strip.style.animationDelay = delay + "s";
  return secs;
}

function stripProgress(strip){
  if(!strip || !strip.getAnimations) return 0;
  const anim = strip.getAnimations()[0];
  if(!anim) return 0;
  // getComputedTiming().progress already accounts for animation-delay.
  // Reading currentTime directly does not, so once a negative delay has been
  // applied the two disagree and the strip appears to jump backwards.
  const p = anim.effect.getComputedTiming().progress;
  return (typeof p === "number" && isFinite(p)) ? p : 0;
}

async function load(){
  document.getElementById("updated").textContent = "Updating…";

  const results = await Promise.all(LEAGUES.map(getLeague));

  const active = LEAGUES
    .map((lg, i) => ({ lg, games: results[i] }))
    .filter(r => r.games === null || r.games.length > 0);

  const rows = active.length ? active : [{ lg:{label:"\u2014"}, games:[] }];
  const labels = rows.map(r => r.lg.label).join("|");

  // stash the full lists; visibleGames() slices out the current page
  rows.forEach(r => leagueGames.set(r.lg.label, r.games));

  if(labels !== renderedLabels){
    // the set of leagues changed (a season started or ended) — full rebuild
    board.style.setProperty("--rowh", (100 / rows.length) + "%");
    board.innerHTML = rows.map(r =>
      rowHTML(r.lg, visibleGames(r.lg.label))).join("");
    renderedLabels = labels;
    rendered.clear();

    const sections = board.querySelectorAll(".row");
    rows.forEach((r, i) => {
      const track = sections[i].querySelector(".track");
      rendered.set(r.lg.label, track.innerHTML);
      const strip = track.querySelector(".strip");
      if(strip) setStripSpeed(strip, 0);
      armPaging(r.lg.label, track);
    });
  }else{
    // same leagues — only touch the rows whose scores actually moved
    const sections = board.querySelectorAll(".row");
    rows.forEach((r, i) => {
      const label = r.lg.label;
      const shown = visibleGames(label);
      const html = trackHTML(shown, label);
      if(rendered.get(label) === html) return;   // nothing changed

      // if this row has a score we haven't displayed yet, rewind it to the
      // start so the pinned game is on screen instead of somewhere mid-loop
      const newScore = (shown || []).some(
        g => flashing(g) && !shownFlashes.has(g.id));
      (shown || []).forEach(g => { if(flashing(g)) shownFlashes.add(g.id); });

      const track = sections[i].querySelector(".track");
      const fraction = stripProgress(track.querySelector(".strip"));
      track.innerHTML = html;
      rendered.set(label, html);

      const strip = track.querySelector(".strip");
      if(!strip) return;
      armPaging(label, track);

      if(!newScore){
        setStripSpeed(strip, fraction);
        return;
      }

      // rewind to the front so the scoring game is visible...
      const secs = setStripSpeed(strip, 0);

      // ...then hand the row back to where it was, advanced by the time the
      // flash was on screen, so it reads as an uninterrupted scroll
      clearTimeout(resumeTimers.get(label));
      resumeTimers.set(label, setTimeout(() => {
        if(!strip.isConnected) return;
        const scrolled = (FLASH_SHOWCASE_MS - START_HOLD_MS) / 1000;
        const resumeAt = (fraction + scrolled / secs) % 1;
        setStripSpeed(strip, resumeAt);
      }, FLASH_SHOWCASE_MS));
    });
  }

  document.getElementById("updated").textContent =
    "Updated " + new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});

  // poll harder while games are actually being played, so a score shows up
  // within ~20s instead of a minute; also re-sorts as flashes expire
  const anyLive = rows.some(r => (r.games || []).some(g => g.state === "in"));
  clearTimeout(nextPoll);
  nextPoll = setTimeout(load, anyLive ? LIVE_REFRESH_MS : REFRESH_MS);
}

// pull conference membership first so the very first render sorts correctly,
// then refresh it daily in case of a mid-season move
loadConferences().then(() => {
  // visible readout — tap "Check rosters" in the footer to see it
  confReport = CONFERENCES.map((c, i) =>
    c.name + ": " + confSets[i].size + " — " + [...confSets[i]].join(" ") +
    (confLive[i] ? " [live]" : " [built-in]")
  ).join("\n\n");
  load();
});
setInterval(loadConferences, 24 * 60 * 60 * 1000);

/* ---------- controls ---------- */
// tapping a row freezes it — useful on a phone, where there's no hover
board.addEventListener("click", e => {
  const row = e.target.closest(".row");
  if(row) row.classList.toggle("paused");
});

document.getElementById("tiers").addEventListener("click", e => {
  showTiers = !showTiers;
  e.currentTarget.setAttribute("aria-pressed", String(showTiers));
  e.currentTarget.textContent = showTiers ? "Hide tiers" : "Show tiers";
  renderedLabels = "";   // force a full redraw
  load();
});

document.getElementById("rosters").addEventListener("click", () => {
  alert(confReport || "Rosters still loading…");
});

document.getElementById("refresh").addEventListener("click", load);

document.getElementById("mode").addEventListener("click", e => {
  weekMode = !weekMode;
  e.currentTarget.setAttribute("aria-pressed", String(weekMode));
  e.currentTarget.textContent = weekMode ? "Show today only" : "Show next 7 days";
  document.querySelector("h1").textContent = weekMode ? "Scores & Schedule" : "Live Scores";
  load();
});

const fsBtn = document.getElementById("fs");

// iPhone Safari has no Fullscreen API at all — point at Add to Home Screen
// instead of leaving a button that silently does nothing
if(!document.documentElement.requestFullscreen){
  fsBtn.textContent = "Full screen?";
  fsBtn.addEventListener("click", () => {
    alert("iPhone doesn't allow web pages to go fullscreen.\n\n" +
          "Instead: tap Share, then \"Add to Home Screen\". " +
          "Opening it from that icon runs it without the address bar.");
  });
}else{
  fsBtn.addEventListener("click", () => {
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  });
}

/* keep the display from sleeping while the ticker is up */
let wakeLock = null;
async function keepAwake(){
  try{
    if("wakeLock" in navigator){
      wakeLock = await navigator.wakeLock.request("screen");
    }
  }catch(err){
    // denied or unsupported — nothing to do, the screen just sleeps normally
  }
}
keepAwake();

// the lock is dropped when the tab is backgrounded, so take it again on return
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible"){
    keepAwake();
    load();          // catch up on anything missed while suspended
  }
});
</script>
